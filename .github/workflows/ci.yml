name: CI

# Lint and tests on every push and pull request, plus the two validators a custom
# integration needs: hassfest (Home Assistant's manifest and translation checks) and the
# HACS action. Actions are pinned to exact commits; Dependabot updates them.
# All jobs run on the self-hosted runner on the root server (label "hessis", its own
# Docker daemon via dind), so the private repository uses no Actions minutes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run instead of queueing on the one runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Only docs changed (Markdown, docs/, licence, issue templates)? Then the other jobs
    # skip their steps; GitHub counts skipped required checks as passed. Tags always run everything.
    runs-on: [self-hosted, hessis]
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_REF_TYPE" != tag ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: [self-hosted, hessis]
    # The pip cache lives in a volume of the runner's Docker daemon. The container runs as
    # root, so nothing may be left in the workspace (bytecode, pytest and ruff caches):
    # the next checkout as the runner user could not remove it.
    container:
      image: python:3.14
      volumes:
        - meshmove-ci-pip:/root/.cache/pip
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        run: pip install -r requirements-dev.txt
      - if: needs.changes.outputs.code == 'true'
        run: ruff check --no-cache .
      - if: needs.changes.outputs.code == 'true'
        run: ruff format --check --no-cache .
      - if: needs.changes.outputs.code == 'true'
        run: pytest -q -p no:cacheprovider

  hassfest:
    needs: changes
    runs-on: [self-hosted, hessis]
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6  # master 2026-10-17

  hacs:
    needs: changes
    runs-on: [self-hosted, hessis]
    steps:
      # The HACS action can only validate public repositories.
      - if: needs.changes.outputs.code == 'true' && !github.event.repository.private
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration
          # The brand icons are added to home-assistant/brands before the first public release.
          ignore: brands
