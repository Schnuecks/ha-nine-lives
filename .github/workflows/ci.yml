name: CI

# Lint and tests on every push and pull request, plus the two validators a custom
# integration needs: hassfest (Home Assistant's manifest and translation checks) and the
# HACS action. Actions are pinned to exact commits; Dependabot updates them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Only docs changed (Markdown, docs/, licence, issue templates)? Then the other jobs
    # skip their steps; GitHub counts skipped required checks as passed. Tags always run everything.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_REF_TYPE" != tag ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - if: needs.changes.outputs.code == 'true'
        run: pip install -r requirements-dev.txt
      - if: needs.changes.outputs.code == 'true'
        run: ruff check .
      - if: needs.changes.outputs.code == 'true'
        run: ruff format --check .
      - if: needs.changes.outputs.code == 'true'
        run: pytest -q

  hassfest:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6  # master 2026-10-17

  hacs:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration
