name: Feature request
description: An idea for Nine Lives
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation, for example the kind of device you are replacing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Nine Lives help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
